version: 2
project_name: venix
before:
  hooks:
    - go mod tidy
builds:
  - id: venix
    main: ./cmd/venix
    binary: venix
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: [-s -w -X main.version={{.Version}}]
archives:
  - formats: [tar.gz]
    ids: [venix]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
