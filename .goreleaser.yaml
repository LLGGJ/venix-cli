version: 2
project_name: venix

before:
  hooks:
    - go mod tidy

builds:
  - id: venix
    main: ./cmd/venix
    binary: venix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: venix-archives
    ids:
      - venix
    formats:
      - tar.gz
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt
