name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/venix ./cmd/venix
      - run: /tmp/venix --version && /tmp/venix help
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          V=0.0.0
          bash scripts/release/check-names.sh "$V"
          bash scripts/release/check-npm.sh "$V"
