name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Validar código Go
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -d cmd internal)"
          go vet ./...
          go test ./...

      - name: Criar GitHub Release e artefatos
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js para Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sincronizar versão do pacote npm
        working-directory: npm-package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: npm version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Publicar instalador npm via OIDC
        working-directory: npm-package
        run: npm publish --access public --provenance
