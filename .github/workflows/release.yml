name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Validar código Go
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -d cmd internal)"
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildmode=pie -o /tmp/venix-android-arm64 ./cmd/venix

      - name: Criar GitHub Release e artefatos
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node para publicar o instalador npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Atualizar versão do instalador npm
        working-directory: npm-package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: npm version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Empacotar ponte npm na GitHub Release
        working-directory: npm-package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Anexar pacote npm à GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP"/venix-*.tgz --clobber

      - name: Publicar ponte npm para o binário Go
        working-directory: npm-package
        continue-on-error: true
        run: npm publish --access public --provenance
