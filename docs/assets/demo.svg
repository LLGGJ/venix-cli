  <text x="450" y="25" text-anchor="middle" fill="#6f7aa8" style="font-size:13px">venix — simulação ilustrativa</text>
  <text x="34" y="92" clip-path="url(#c0)"><tspan fill="#35e0e6">$ </tspan><tspan fill="#e8ecff">venix login</tspan></text><text class="l1" x="34" y="116" xml:space="preserve"><tspan fill="#7b93ff" xml:space="preserve">◆ Autorizar a CLI da VenixCloud</tspan></text><text class="l2" x="34" y="140" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">Navegador aberto. Conclua a autorização e volte aqui.</tspan></text><text class="l3" x="34" y="164" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">Login concluído</tspan></text><text x="34" y="188" clip-path="url(#c4)"><tspan fill="#35e0e6">$ </tspan><tspan fill="#e8ecff">venix apps</tspan></text><text class="l5" x="34" y="212" xml:space="preserve"><tspan fill="#7b93ff" xml:space="preserve">◆ APLICAÇÕES</tspan><tspan fill="#6f7aa8" xml:space="preserve"> • </tspan><tspan fill="#35e0e6" xml:space="preserve">ao vivo</tspan></text><text class="l6" x="34" y="236" xml:space="preserve"><tspan fill="#6f7aa8" xml:space="preserve">  NOME             STATUS      USO</tspan></text><text class="l7" x="34" y="260" xml:space="preserve"><tspan fill="#35e0e6" xml:space="preserve">❯ </tspan><tspan fill="#35e0e6" xml:space="preserve">api-darck-shop   </tspan><tspan fill="#35e0a1" xml:space="preserve">● ONLINE    </tspan><tspan fill="#e8ecff" xml:space="preserve">CPU 12% • 256/1024 MB</tspan></text><text class="l8" x="34" y="284" xml:space="preserve"><tspan fill="#e8ecff" xml:space="preserve">  zouder filas     </tspan><tspan fill="#ff5d73" xml:space="preserve">● OFFLINE   </tspan><tspan fill="#e8ecff" xml:space="preserve">384 MB</tspan></text><text class="l9" x="34" y="308" xml:space="preserve"><tspan fill="#e8ecff" xml:space="preserve">  tickets          </tspan><tspan fill="#35e0a1" xml:space="preserve">● ONLINE    </tspan><tspan fill="#e8ecff" xml:space="preserve">CPU 3% • 120/512 MB</tspan></text><text class="l10" x="34" y="332" xml:space="preserve"><tspan fill="#e8ecff" xml:space="preserve">  venix-cloud      </tspan><tspan fill="#f5c451" xml:space="preserve">● INICIANDO </tspan><tspan fill="#e8ecff" xml:space="preserve">300 MB</tspan></text><text x="34" y="356" clip-path="url(#c11)"><tspan fill="#35e0e6">$ </tspan><tspan fill="#e8ecff">venix doctor</tspan></text><text class="l12" x="34" y="380" xml:space="preserve"><tspan fill="#7b93ff" xml:space="preserve">◆ Venix Doctor</tspan></text><text class="l13" x="34" y="404" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">Versão       </tspan><tspan fill="#6f7aa8" xml:space="preserve">1.x • linux/arm64</tspan></text><text class="l14" x="34" y="428" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">Login        </tspan><tspan fill="#6f7aa8" xml:space="preserve">sessão válida</tspan></text><text class="l15" x="34" y="452" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">API          </tspan><tspan fill="#6f7aa8" xml:space="preserve">HTTP 200 • 84 ms</tspan></text><text class="l16" x="34" y="476" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#e8ecff" xml:space="preserve">Navegador    </tspan><tspan fill="#6f7aa8" xml:space="preserve">termux-open-url, am</tspan></text><text class="l17" x="34" y="500" xml:space="preserve"><tspan fill="#35e0a1" xml:space="preserve">✔ </tspan><tspan fill="#35e0a1" xml:space="preserve">8 verificações • 0 avisos • 0 falhas</tspan></text>
